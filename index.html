<!DOCTYPE html>
<html lang="vi">
<head>
  <!-- Thêm viewport-fit=cover để hỗ trợ tai thỏ/Dynamic Island trên iOS -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Phòng Chat Đa Nền Tảng</title>
  <style>
    :root {
      --primary: #007aff;
      --bg-color: #f0f2f5;
      --msg-me: #0084ff;
      --msg-other: #e4e6eb;
      --text-main: #1c1c1e;
    }
    
    /* Reset và thiết lập chiều cao chuẩn tuyệt đối cho Mobile */
    html, body { 
      height: 100%; 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--bg-color);
      overflow: hidden; /* Chống cuộn toàn trang */
    }

    body {
      display: flex; 
      justify-content: center; 
    }
    
    .app-container { 
      width: 100%; 
      max-width: 500px; 
      height: 100%; /* Dùng 100% thay vì 100vh để không bị lẹm đáy */
      background: #fff; 
      display: flex; 
      flex-direction: column; 
      position: relative;
    }

    /* Màn hình Vào phòng */
    #joinScreen { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px; background: #fff; z-index: 10; }
    .logo-icon { font-size: 50px; text-align: center; margin-bottom: 15px; }
    .join-title { text-align: center; font-size: 1.4rem; color: var(--text-main); margin-bottom: 25px; font-weight: 700; }
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.85rem; color: #65676b; margin-bottom: 5px; font-weight: 600; }
    .input-group input { width: 100%; padding: 14px; border: 1.5px solid #ddd; border-radius: 12px; font-size: 1rem; outline: none; transition: 0.2s; }
    .input-group input:focus { border-color: var(--primary); }
    .btn-join { width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .status-text { text-align: center; margin-top: 15px; font-size: 0.9rem; color: #e41c38; font-weight: 500; min-height: 20px; }

    /* Màn hình Chat */
    #chatScreen { display: none; flex-direction: column; height: 100%; }
    .chat-header { background: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e4e6eb; z-index: 5; padding-top: max(12px, env(safe-area-inset-top)); }
    .room-info { font-weight: bold; font-size: 1.05rem; color: var(--text-main); }
    .room-info span { color: var(--primary); }
    .btn-leave { background: #f2f2f2; color: #e41c38; border: none; padding: 6px 12px; border-radius: 8px; font-size: 0.85rem; font-weight: bold; cursor: pointer; }

    /* Khu vực tin nhắn */
    .chat-messages { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      background: #f9f9f9; 
      min-height: 0; /* Bắt buộc phải có để flexbox cuộn đúng trên mobile */
    }
    
    .msg-wrapper { display: flex; flex-direction: column; max-width: 80%; }
    .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }
    
    .msg-sender { font-size: 0.75rem; color: #65676b; margin-bottom: 4px; padding: 0 4px; font-weight: 600; }
    .msg-wrapper.me .msg-sender { display: none; }
    
    .msg-bubble { padding: 10px 14px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .msg-wrapper.me .msg-bubble { background: var(--msg-me); color: #fff; border-bottom-right-radius: 4px; }
    .msg-wrapper.other .msg-bubble { background: var(--msg-other); color: var(--text-main); border-bottom-left-radius: 4px; }
    
    .msg-system { align-self: center; font-size: 0.8rem; color: #65676b; background: #e4e6eb; padding: 4px 12px; border-radius: 12px; margin: 8px 0; text-align: center; }

    /* Khu vực nhập liệu */
    .chat-input-area { 
      padding: 10px 12px; 
      background: #fff; 
      border-top: 1px solid #ddd; 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      /* Đệm thêm khoảng trống phía dưới cho các dòng iPhone không có nút Home */
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    .chat-input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 20px; font-size: 0.95rem; outline: none; }
    .chat-input-area input:focus { border-color: var(--primary); }
    .btn-send { background: var(--primary); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
    .btn-send svg { width: 18px; height: 18px; fill: white; transform: translateX(-1px); }
    .btn-send:disabled { background: #ccc; }
  </style>
  
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div class="app-container">
    
    <div id="joinScreen">
      <div class="logo-icon">💬</div>
      <h2 class="join-title">Vào Phòng Trực Tuyến</h2>
      
      <div class="input-group">
        <label for="userName">Tên hiển thị</label>
        <input type="text" id="userName" placeholder="Nhập tên của bạn..." required />
      </div>
      
      <div class="input-group">
        <label for="roomCode">Mã phòng (4 số)</label>
        <input type="tel" id="roomCode" maxlength="4" placeholder="Ví dụ: 8888" required />
      </div>
      
      <button class="btn-join" id="btnJoin">Vào Phòng</button>
      <div class="status-text" id="joinStatus"></div>
    </div>

    <div id="chatScreen">
      <div class="chat-header">
        <div class="room-info">Phòng: <span id="displayRoomCode">----</span></div>
        <button class="btn-leave" id="btnLeave">Rời phòng</button>
      </div>
      
      <div class="chat-messages" id="chatMessages"></div>
      
      <form class="chat-input-area" id="chatForm">
        <input type="text" id="msgInput" placeholder="Nhắn tin..." autocomplete="off" required />
        <button type="submit" class="btn-send" id="btnSend">
          <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
        </button>
      </form>
    </div>

  </div>

  <script>
    const joinScreen = document.getElementById("joinScreen");
    const chatScreen = document.getElementById("chatScreen");
    const btnJoin = document.getElementById("btnJoin");
    const btnLeave = document.getElementById("btnLeave");
    const joinStatus = document.getElementById("joinStatus");
    const userNameInput = document.getElementById("userName");
    const roomCodeInput = document.getElementById("roomCode");
    const displayRoomCode = document.getElementById("displayRoomCode");
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const btnSend = document.getElementById("btnSend");

    let client = null;
    let currentTopic = "";
    let myName = localStorage.getItem("chat_name") || "";
    
    if (myName) userNameInput.value = myName;

    btnJoin.addEventListener("click", () => {
      const name = userNameInput.value.trim();
      const room = roomCodeInput.value.trim();

      if (!name) return showStatus("Vui lòng nhập tên của bạn!");
      if (room.length !== 4 || isNaN(room)) return showStatus("Vui lòng nhập đúng 4 số!");

      myName = name;
      localStorage.setItem("chat_name", myName);
      joinStatus.style.color = "#007aff";
      showStatus("Đang kết nối...");
      btnJoin.disabled = true;

      const clientId = 'web_client_' + Math.random().toString(16).substring(2, 10);
      const host = 'wss://broker.emqx.io:8084/mqtt';

      client = mqtt.connect(host, { clientId: clientId, clean: true, connectTimeout: 4000 });

      client.on('connect', () => {
        currentTopic = `github_p2p_room_${room}`;
        client.subscribe(currentTopic, (err) => {
          if (!err) {
            joinScreen.style.display = "none";
            chatScreen.style.display = "flex";
            displayRoomCode.innerText = room;
            chatMessages.innerHTML = ""; 
            
            appendSystemMessage(`Bạn đã tham gia phòng ${room}`);
            
            const joinMsg = { type: 'system', text: `${myName} đã vào phòng` };
            client.publish(currentTopic, JSON.stringify(joinMsg));
          }
        });
      });

      client.on('message', (topic, message) => {
        try {
          const data = JSON.parse(message.toString());
          if (data.type === 'system' && data.text.indexOf(myName) === -1) {
            appendSystemMessage(data.text);
          } else if (data.type === 'chat') {
            appendChatMessage(data.sender, data.text, data.sender === myName ? 'me' : 'other');
          }
        } catch(e) {}
      });

      client.on('error', () => {
        showStatus("Lỗi kết nối máy chủ, vui lòng thử lại!");
        btnJoin.disabled = false;
        if (client) client.end();
      });
    });

    btnLeave.addEventListener("click", () => {
      if (client) {
        const leaveMsg = { type: 'system', text: `${myName} đã rời phòng` };
        client.publish(currentTopic, JSON.stringify(leaveMsg));
        client.end();
      }
      chatScreen.style.display = "none";
      joinScreen.style.display = "flex";
      btnJoin.disabled = false;
      showStatus("");
    });

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (text && client && client.connected) {
        const payload = { type: 'chat', sender: myName, text: text };
        client.publish(currentTopic, JSON.stringify(payload));
        msgInput.value = "";
        msgInput.focus();
      }
    });

    function showStatus(text) {
      joinStatus.innerText = text;
    }

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg-system';
      div.innerText = text;
      chatMessages.appendChild(div);
      scrollToBottom();
    }

    function appendChatMessage(sender, text, role) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      const senderDiv = document.createElement('div');
      senderDiv.className = 'msg-sender';
      senderDiv.innerText = sender;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'msg-bubble';
      bubbleDiv.innerText = text;

      wrapper.appendChild(senderDiv);
      wrapper.appendChild(bubbleDiv);
      chatMessages.appendChild(wrapper);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kênh Chat Toàn Cầu</title>
  <style>
    :root {
      --primary: #007aff;
      --bg-color: #f0f2f5;
      --msg-me: #0084ff;
      --msg-other: #e4e6eb;
      --text-main: #1c1c1e;
    }
    
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--bg-color);
      overflow: hidden; 
      position: fixed; 
      top: 0; left: 0;
    }

    .app-container { 
      position: absolute; 
      top: 0; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; 
      max-width: 500px; 
      background: #fff; 
      display: flex; 
      flex-direction: column; 
    }

    /* Màn hình Chat (Hiển thị ngay lập tức) */
    .chat-header { 
      background: #fff; 
      padding: 12px 16px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      border-bottom: 1px solid #e4e6eb; 
      padding-top: max(12px, env(safe-area-inset-top)); 
      flex-shrink: 0;
    }
    .room-title { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
    .status-text { font-size: 0.75rem; color: #ff3b30; font-weight: 600; margin-top: 4px; }

    /* Khu vực hiển thị tin nhắn */
    .chat-messages { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
      background: #f9f9f9; 
    }
    
    .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
    .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }
    
    .msg-sender { font-size: 0.75rem; color: #65676b; margin-bottom: 4px; padding: 0 4px; font-weight: 600; }
    .msg-wrapper.me .msg-sender { display: none; }
    
    /* FIX LỖI TRÀN CHỮ KHI NHẬP LINK DÀI */
    .msg-bubble { 
      padding: 10px 14px; 
      border-radius: 18px; 
      font-size: 0.95rem; 
      line-height: 1.4; 
      
      /* Cắt chữ để chống tràn khung ảnh */
      word-break: break-word; 
      overflow-wrap: anywhere; 
      white-space: pre-wrap; 
    }
    
    .msg-wrapper.me .msg-bubble { background: var(--msg-me); color: #fff; border-bottom-right-radius: 4px; }
    .msg-wrapper.other .msg-bubble { background: var(--msg-other); color: var(--text-main); border-bottom-left-radius: 4px; }
    
    .msg-system { align-self: center; font-size: 0.8rem; color: #65676b; background: #e4e6eb; padding: 4px 12px; border-radius: 12px; margin: 8px 0; text-align: center; }

    /* Khu vực nhập liệu */
    .chat-input-area { 
      padding: 10px 12px; 
      background: #fff; 
      border-top: 1px solid #ddd; 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      padding-bottom: max(10px, env(safe-area-inset-bottom)); 
      flex-shrink: 0; 
    }
    .chat-input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 20px; font-size: 0.95rem; outline: none; box-sizing: border-box; }
    .chat-input-area input:focus { border-color: var(--primary); }
    .btn-send { background: var(--primary); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
    .btn-send svg { width: 18px; height: 18px; fill: white; transform: translateX(-1px); }
    .btn-send:disabled { background: #ccc; }
  </style>
  
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div class="app-container">
    <div class="chat-header">
      <div class="room-title">Kênh Chat Chung</div>
      <div class="status-text" id="statusText">Đang kết nối...</div>
    </div>
    
    <div class="chat-messages" id="chatMessages"></div>
    
    <form class="chat-input-area" id="chatForm">
      <input type="text" id="msgInput" placeholder="Nhắn tin..." autocomplete="off" required disabled />
      <button type="submit" class="btn-send" id="btnSend" disabled>
        <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
      </button>
    </form>
  </div>

  <script>
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const btnSend = document.getElementById("btnSend");
    const statusText = document.getElementById("statusText");

    // 1. GÁN TÊN NGẪU NHIÊN ẨN DANH VÀ ID DUY NHẤT
    let myId = localStorage.getItem("chat_uid");
    if (!myId) {
      myId = "user_" + Math.random().toString(36).substr(2, 9);
      localStorage.setItem("chat_uid", myId);
    }
    
    let myName = localStorage.getItem("chat_random_name");
    if (!myName) {
      myName = "Ẩn danh " + Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem("chat_random_name", myName);
    }

    // 2. KHỞI TẠO LỊCH SỬ CHAT TỪ LOCAL STORAGE
    let localHistory = JSON.parse(localStorage.getItem("global_chat_history")) || [];
    
    function saveHistory(msgObj) {
      localHistory.push(msgObj);
      if (localHistory.length > 200) localHistory.shift(); // Chỉ giữ tối đa 200 tin nhắn gần nhất cho nhẹ máy
      localStorage.setItem("global_chat_history", JSON.stringify(localHistory));
    }

    function renderHistory() {
      chatMessages.innerHTML = "";
      localHistory.forEach(msg => {
        if (msg.type === 'chat') {
          appendChatMessage(msg.sender, msg.text, msg.uid === myId ? 'me' : 'other');
        }
      });
      scrollToBottom();
    }
    
    // In lịch sử cũ ngay khi mở web
    renderHistory();

    // 3. KẾT NỐI SERVER MQTT
    const GLOBAL_TOPIC = "github_global_public_chat_2026_v1";
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { 
      clientId: myId + '_' + Date.now(),
      clean: true 
    });

    let syncTimeout = null;

    client.on('connect', () => {
      statusText.innerText = `Tên của bạn: ${myName}`;
      statusText.style.color = "#34c759"; // Màu xanh lá
      msgInput.disabled = false;
      btnSend.disabled = false;

      client.subscribe(GLOBAL_TOPIC, (err) => {
        if (!err) {
          // Xin lịch sử từ những người đang online (Nếu lịch sử của mình đang trống)
          if (localHistory.length === 0) {
            client.publish(GLOBAL_TOPIC, JSON.stringify({ type: 'sync_req', from: myId }));
          }
          
          // Báo đã tham gia
          client.publish(GLOBAL_TOPIC, JSON.stringify({ type: 'system', text: `${myName} đã vào kênh` }));
        }
      });
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        
        // Nhận tin nhắn chat bình thường
        if (data.type === 'chat') {
          // Chống trùng lặp tin nhắn
          const isExist = localHistory.some(m => m.msgId === data.msgId);
          if (!isExist) {
            saveHistory(data);
            appendChatMessage(data.sender, data.text, data.uid === myId ? 'me' : 'other');
          }
        } 
        
        // Nhận thông báo hệ thống
        else if (data.type === 'system') {
          appendSystemMessage(data.text);
        }

        // CƠ CHẾ P2P: Có người mới xin lịch sử, mình sẽ gửi cho họ nếu mình có
        else if (data.type === 'sync_req' && data.from !== myId) {
          if (localHistory.length > 0) {
            // Đợi random 1 khoảng thời gian để tránh nhiều người gửi cùng lúc gây lag
            syncTimeout = setTimeout(() => {
              client.publish(GLOBAL_TOPIC, JSON.stringify({ 
                type: 'sync_res', 
                to: data.from, 
                history: localHistory 
              }));
            }, Math.random() * 1500);
          }
        }

        // CƠ CHẾ P2P: Nhận được cục lịch sử từ người khác gửi cho mình
        else if (data.type === 'sync_res') {
          // Hủy bỏ việc tự gửi lịch sử đi nếu đã có người khác gửi hộ
          if (syncTimeout) clearTimeout(syncTimeout);

          // Nhận lịch sử cập nhật
          if (data.to === myId && localHistory.length === 0) {
            localHistory = data.history;
            localStorage.setItem("global_chat_history", JSON.stringify(localHistory));
            renderHistory();
          }
        }
      } catch(e) {}
    });

    client.on('error', () => {
      statusText.innerText = "Mất kết nối máy chủ!";
      statusText.style.color = "#ff3b30";
    });

    // 4. GỬI TIN NHẮN
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (text && client && client.connected) {
        
        const msgObj = { 
          type: 'chat', 
          uid: myId, 
          sender: myName, 
          text: text,
          msgId: Date.now() + Math.random().toString(36).substr(2, 5) // Tạo ID duy nhất cho tin nhắn
        };
        
        client.publish(GLOBAL_TOPIC, JSON.stringify(msgObj));
        msgInput.value = "";
        
        // Đảm bảo bàn phím không bị ẩn trên mobile sau khi ấn gửi
        setTimeout(() => msgInput.focus(), 10);
      }
    });

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg-system';
      div.innerText = text;
      chatMessages.appendChild(div);
      scrollToBottom();
    }

    function appendChatMessage(sender, text, role) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      const senderDiv = document.createElement('div');
      senderDiv.className = 'msg-sender';
      senderDiv.innerText = sender;

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'msg-bubble';
      bubbleDiv.innerText = text;

      wrapper.appendChild(senderDiv);
      wrapper.appendChild(bubbleDiv);
      chatMessages.appendChild(wrapper);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>

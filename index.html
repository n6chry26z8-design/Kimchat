<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kênh Chat Toàn Cầu</title>
  <style>
    :root {
      --primary: #007aff;
      --bg-color: #f0f2f5;
      --msg-me: #0084ff;
      --msg-other: #e4e6eb;
      --text-main: #1c1c1e;
    }
    
    html, body { 
      margin: 0; 
      padding: 0; 
      width: 100%; 
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--bg-color);
      overflow: hidden; 
      position: fixed; 
      top: 0; left: 0;
    }

    .app-container { 
      position: absolute; 
      top: 0; bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; 
      max-width: 500px; 
      background: #fff; 
      display: flex; 
      flex-direction: column; 
    }

    .chat-header { 
      background: #fff; 
      padding: 12px 16px; 
      display: flex; 
      flex-direction: column;
      align-items: center; 
      border-bottom: 1px solid #e4e6eb; 
      padding-top: max(12px, env(safe-area-inset-top)); 
      flex-shrink: 0;
    }
    .room-title { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
    .status-text { font-size: 0.75rem; color: #ff3b30; font-weight: 600; margin-top: 4px; }

    .chat-messages { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      background: #f9f9f9; 
    }
    
    .msg-wrapper { display: flex; flex-direction: column; max-width: 92%; }
    .msg-wrapper.me { align-self: flex-end; align-items: flex-end; }
    .msg-wrapper.other { align-self: flex-start; align-items: flex-start; }
    
    .msg-sender { font-size: 0.75rem; color: #65676b; margin-bottom: 4px; padding: 0 4px; font-weight: 600; }
    .msg-wrapper.me .msg-sender { display: none; }
    
    /* Bố cục mới chứa Bóng chat + Nút Copy */
    .msg-content { display: flex; align-items: flex-end; gap: 6px; width: 100%; }
    .msg-wrapper.me .msg-content { flex-direction: row-reverse; }

    .msg-bubble { 
      padding: 10px 14px; 
      border-radius: 18px; 
      font-size: 0.95rem; 
      line-height: 1.4; 
      word-break: break-word; 
      overflow-wrap: anywhere; 
      white-space: pre-wrap;
      max-width: calc(100% - 32px); /* Nhường chỗ cho nút copy */
    }
    
    .msg-wrapper.me .msg-bubble { background: var(--msg-me); color: #fff; border-bottom-right-radius: 4px; }
    .msg-wrapper.other .msg-bubble { background: var(--msg-other); color: var(--text-main); border-bottom-left-radius: 4px; }
    
    /* Nút Copy Tùy Chỉnh */
    .btn-copy { 
      background: transparent; 
      border: none; 
      cursor: pointer; 
      padding: 4px; 
      color: #a1a1aa; 
      flex-shrink: 0; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      border-radius: 50%; 
      transition: all 0.2s ease; 
    }
    .btn-copy:active { transform: scale(0.7); }
    .btn-copy svg { width: 18px; height: 18px; fill: currentColor; }
    /* Nút Copy của mình (bên trái bóng chat) thì mờ hơn một chút để không rối mắt */
    .msg-wrapper.me .btn-copy { color: #d1d1d6; }

    .msg-system { align-self: center; font-size: 0.8rem; color: #65676b; background: #e4e6eb; padding: 4px 12px; border-radius: 12px; margin: 8px 0; text-align: center; }

    .chat-input-area { 
      padding: 10px 12px; 
      background: #fff; 
      border-top: 1px solid #ddd; 
      display: flex; 
      gap: 8px; 
      align-items: center; 
      padding-bottom: max(10px, env(safe-area-inset-bottom)); 
      flex-shrink: 0; 
    }
    .chat-input-area input { flex: 1; padding: 12px 16px; border: 1px solid #ccc; border-radius: 20px; font-size: 0.95rem; outline: none; box-sizing: border-box; }
    .chat-input-area input:focus { border-color: var(--primary); }
    .btn-send { background: var(--primary); color: white; border: none; width: 42px; height: 42px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
    .btn-send svg { width: 18px; height: 18px; fill: white; transform: translateX(-1px); }
    .btn-send:disabled { background: #ccc; }
  </style>
  
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

  <div class="app-container">
    <div class="chat-header">
      <div class="room-title">Kênh Chat Chung</div>
      <div class="status-text" id="statusText">Đang kết nối...</div>
    </div>
    
    <div class="chat-messages" id="chatMessages"></div>
    
    <form class="chat-input-area" id="chatForm">
      <input type="text" id="msgInput" placeholder="Nhắn tin..." autocomplete="off" required disabled />
      <button type="submit" class="btn-send" id="btnSend" disabled>
        <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
      </button>
    </form>
  </div>

  <script>
    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const msgInput = document.getElementById("msgInput");
    const btnSend = document.getElementById("btnSend");
    const statusText = document.getElementById("statusText");

    let myId = localStorage.getItem("chat_uid");
    if (!myId) {
      myId = "user_" + Math.random().toString(36).substr(2, 9);
      localStorage.setItem("chat_uid", myId);
    }
    
    let myName = localStorage.getItem("chat_random_name");
    if (!myName) {
      myName = "Ẩn danh " + Math.floor(1000 + Math.random() * 9000);
      localStorage.setItem("chat_random_name", myName);
    }

    let localHistory = JSON.parse(localStorage.getItem("global_chat_history")) || [];
    
    function saveHistory(msgObj) {
      localHistory.push(msgObj);
      if (localHistory.length > 200) localHistory.shift(); 
      localStorage.setItem("global_chat_history", JSON.stringify(localHistory));
    }

    function renderHistory() {
      chatMessages.innerHTML = "";
      localHistory.forEach(msg => {
        if (msg.type === 'chat') {
          appendChatMessage(msg.sender, msg.text, msg.uid === myId ? 'me' : 'other');
        }
      });
      scrollToBottom();
    }
    
    renderHistory();

    const GLOBAL_TOPIC = "github_global_public_chat_2026_v1";
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { 
      clientId: myId + '_' + Date.now(),
      clean: true 
    });

    let syncTimeout = null;

    client.on('connect', () => {
      statusText.innerText = `Tên của bạn: ${myName}`;
      statusText.style.color = "#34c759";
      msgInput.disabled = false;
      btnSend.disabled = false;

      client.subscribe(GLOBAL_TOPIC, (err) => {
        if (!err) {
          if (localHistory.length === 0) {
            client.publish(GLOBAL_TOPIC, JSON.stringify({ type: 'sync_req', from: myId }));
          }
          client.publish(GLOBAL_TOPIC, JSON.stringify({ type: 'system', text: `${myName} đã vào kênh` }));
        }
      });
    });

    client.on('message', (topic, message) => {
      try {
        const data = JSON.parse(message.toString());
        
        if (data.type === 'chat') {
          const isExist = localHistory.some(m => m.msgId === data.msgId);
          if (!isExist) {
            saveHistory(data);
            appendChatMessage(data.sender, data.text, data.uid === myId ? 'me' : 'other');
          }
        } 
        else if (data.type === 'system') {
          appendSystemMessage(data.text);
        }
        else if (data.type === 'sync_req' && data.from !== myId) {
          if (localHistory.length > 0) {
            syncTimeout = setTimeout(() => {
              client.publish(GLOBAL_TOPIC, JSON.stringify({ 
                type: 'sync_res', 
                to: data.from, 
                history: localHistory 
              }));
            }, Math.random() * 1500);
          }
        }
        else if (data.type === 'sync_res') {
          if (syncTimeout) clearTimeout(syncTimeout);
          if (data.to === myId && localHistory.length === 0) {
            localHistory = data.history;
            localStorage.setItem("global_chat_history", JSON.stringify(localHistory));
            renderHistory();
          }
        }
      } catch(e) {}
    });

    client.on('error', () => {
      statusText.innerText = "Mất kết nối máy chủ!";
      statusText.style.color = "#ff3b30";
    });

    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (text && client && client.connected) {
        const msgObj = { 
          type: 'chat', 
          uid: myId, 
          sender: myName, 
          text: text,
          msgId: Date.now() + Math.random().toString(36).substr(2, 5) 
        };
        client.publish(GLOBAL_TOPIC, JSON.stringify(msgObj));
        msgInput.value = "";
        setTimeout(() => msgInput.focus(), 10);
      }
    });

    function appendSystemMessage(text) {
      const div = document.createElement('div');
      div.className = 'msg-system';
      div.innerText = text;
      chatMessages.appendChild(div);
      scrollToBottom();
    }

    function appendChatMessage(sender, text, role) {
      const wrapper = document.createElement('div');
      wrapper.className = `msg-wrapper ${role}`;

      const senderDiv = document.createElement('div');
      senderDiv.className = 'msg-sender';
      senderDiv.innerText = sender;

      // Hộp chứa tin nhắn + nút copy
      const contentDiv = document.createElement('div');
      contentDiv.className = 'msg-content';

      const bubbleDiv = document.createElement('div');
      bubbleDiv.className = 'msg-bubble';
      bubbleDiv.innerText = text;

      // Nút Copy
      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn-copy';
      copyBtn.title = 'Sao chép tin nhắn';
      
      // Icon Copy ban đầu
      const iconCopy = `<svg viewBox="0 0 24 24"><path d="M19,21H8V7H19M19,5H8A2,2 0 0,0 6,7V21A2,2 0 0,0 8,23H19A2,2 0 0,0 21,21V7A2,2 0 0,0 19,5M16,1H4A2,2 0 0,0 2,3V17H4V3H16V1Z"/></svg>`;
      // Icon Dấu Tick khi copy thành công
      const iconTick = `<svg viewBox="0 0 24 24"><path fill="#34c759" d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>`;
      
      copyBtn.innerHTML = iconCopy;
      
      copyBtn.onclick = function() {
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.innerHTML = iconTick; // Đổi sang dấu tick xanh
          setTimeout(() => {
            copyBtn.innerHTML = iconCopy; // Trả lại icon cũ sau 1.5s
          }, 1500);
        }).catch(err => {
          alert('Không thể sao chép, vui lòng thử lại!');
        });
      };

      contentDiv.appendChild(bubbleDiv);
      contentDiv.appendChild(copyBtn);

      wrapper.appendChild(senderDiv);
      wrapper.appendChild(contentDiv);
      
      chatMessages.appendChild(wrapper);
      scrollToBottom();
    }

    function scrollToBottom() {
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }
  </script>
</body>
</html>
